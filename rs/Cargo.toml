[package]
name = "cyber-tru"
version = "0.1.1"
edition = "2024"
description = "tru — convergence VM: focusing (φ*) and CT-0 model compilation"
license-file = "LICENSE"
repository = "https://github.com/cyberia-to/tru"
keywords = ["convergence", "rank", "phi", "cyber"]
categories = ["algorithms", "cryptography"]

[lib]
name = "tru"
path = "lib.rs"

[dependencies]
nebu = { package = "strata-nebu", version = "0.1", path = "../../strata/nebu/rs" }
cyber-hemera = { version = "0.3", path = "../../hemera/rs" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
memmap2 = "0.9"
